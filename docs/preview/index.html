<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPX Drop · 交互预览</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="page-heading"><div><span class="page-name">UPX Drop</span><span class="preview-tag">交互预览 · 示例数据</span></div><label class="motion-setting"><input id="reduce-motion" type="checkbox">减少动效</label></header>
<main>
<section class="app" aria-label="UPX Drop 软件交互演示">
<header class="app-header"><div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2563eb"/><path d="M12 10l10 9-10 9M28 10l-10 9 10 9" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><div><strong>UPX Drop <span class="version">1.3.1</span></strong><small>EXE / DLL 批量压缩与解压</small></div></div><span class="engine"><i></i>UPX 5.2.1 · 已就绪</span></header>
<div class="workspace"><div class="left-column">
<div class="dropzone" id="dropzone"><div class="drop-mark" aria-hidden="true">↓</div><div class="drop-copy"><h2 id="drop-title">拖入文件</h2><p>拖入 EXE、DLL 或整个文件夹</p></div><button id="add-example" class="primary">添加示例</button></div>
<div class="stats"><span>总计 <b id="total-size">0 B</b></span><span class="saving">净节省 <b id="saved-size">0 B</b></span><span class="completed">已完成 <b id="done-count">0</b></span></div>
<section class="queue"><header><h2>文件队列 <span id="queue-count">0</span></h2><button class="quiet" id="reset-queue">清空演示</button></header><div class="filters"><input id="search" type="search" aria-label="搜索文件" placeholder="搜索文件名"><select id="status" aria-label="筛选状态"><option value="all">全部状态</option><option value="waiting">等待 / 处理中</option><option value="done">已完成</option></select></div><div class="table-wrap"><table><thead><tr><th>文件</th><th>状态</th><th>原大小</th><th>处理后</th></tr></thead><tbody id="file-rows"></tbody></table><div class="empty" id="empty"><span class="empty-file" aria-hidden="true">＋</span><h3 id="empty-title">还没有文件</h3><p id="empty-copy">点“添加示例”加入文件。</p><button id="empty-tutorial" class="quiet">用示例练习</button></div></div><footer><small id="visible-count">显示 0 / 0</small></footer></section>
<div class="run-footer"><div><strong id="summary" role="status" aria-live="polite">准备就绪</strong><small id="run-hint">先添加示例。</small></div><button class="primary" id="run" disabled>开始压缩</button></div><div class="progress-track" role="progressbar" aria-label="处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
</div><aside class="controls"><h2>控制面板</h2><h3>处理方式</h3><div class="segments" id="mode-options" role="group" aria-label="处理方式"><span class="pill"></span><button aria-pressed="true" data-mode="pack">压缩</button><button aria-pressed="false" data-mode="unpack">解压</button></div><h3>压缩强度</h3><div class="segments three" id="preset-options" role="group" aria-label="压缩强度"><span class="pill"></span><button aria-pressed="false" data-preset="0">快速</button><button aria-pressed="true" data-preset="1">均衡</button><button aria-pressed="false" data-preset="2">极致</button></div><p id="mode-hint">兼顾处理速度和文件大小。</p><label class="check"><input type="checkbox" id="backup" checked>保留原文件备份</label><details id="advanced"><summary>高级压缩选项</summary><div class="advanced-body"><label class="check"><input type="checkbox">尝试全部方法</label><label class="check"><input type="checkbox" checked>压缩导出区段</label><label for="overlay">附加数据</label><select id="overlay"><option>保留附加数据</option><option>丢弃（不可还原）</option><option>含附加数据时跳过</option></select><label for="icons">图标处理</label><select id="icons"><option>保留第一个图标目录</option><option>不压缩图标</option><option>保留第一个图标</option><option>压缩全部图标</option></select></div></details><div class="meters"><h3>体积对比</h3><div><span>输入</span><b id="input-size">0 B</b></div><div class="meter" id="input-meter"></div><div><span>输出</span><b id="output-size">—</b></div><div class="meter green" id="output-meter"></div></div></aside></div>
<footer class="app-footer"><button id="footer-tutorial" class="quiet">新手教程</button></footer>
</section>
</main>
<dialog id="tutorial" aria-labelledby="tutorial-title"><header><strong>新手教程 <span id="step-label">1 / 3</span></strong><button id="tutorial-close" class="quiet" aria-label="关闭教程">关闭教程 <kbd>Esc</kbd></button></header><div class="tutorial-page" id="tutorial-page"><div class="practice"><small>示例文件</small><div class="sample-file" id="sample-file"><span class="file-extension">EXE</span><b>hello-world.exe</b><span id="sample-status">示例文件 · 8.0 MB</span></div><div class="progress-track"><div id="practice-progress"></div></div><button id="practice-action">添加示例</button></div><div class="lesson"><h2 id="tutorial-title">添加文件</h2><p id="tutorial-body"></p><div id="tutorial-presets" hidden><small>压缩强度</small><div class="lesson-presets"><button data-lesson="0">快速</button><button data-lesson="1">均衡</button><button data-lesson="2">极致</button></div></div><p class="note" id="tutorial-note"></p></div></div><footer><div class="step-dots" aria-hidden="true"><i></i><i></i><i></i></div><div><button class="quiet" id="tutorial-back">上一步</button><button class="primary" id="tutorial-next">下一步</button></div></footer></dialog>
<script src="app.js"></script>
</body></html>
